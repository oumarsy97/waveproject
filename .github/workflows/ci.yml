name: NestJS CI/CD Pipeline

on:
  push:
    branches: [ omar ]
  pull_request:
    branches: [ omar ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build
      run: npm run build
    
    - name: Run tests
      run: npm test
      
    - name: Run linter
      run: npm run lint

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/omar' && github.event_name == 'push'
    
    steps:
    - name: Deploy to Render
      run: |
        curl -X POST "https://api.render.com/deploy/srv-rnd_cM0iM2XkhNshPFIptMwRvPibp9Gu"